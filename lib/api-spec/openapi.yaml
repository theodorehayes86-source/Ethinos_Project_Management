openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - FirebaseBearer: []
tags:
  - name: health
    description: Health operations
paths:
  /creative-studio/bootstrap:
    get:
      operationId: getCreativeStudioBootstrap
      responses:
        "200":
          description: Authorized Creative Studio capabilities and directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioBootstrap"
  /creative-studio/defaults:
    put:
      operationId: putCreativeStudioDefaults
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioAutomation"
      responses:
        "200":
          description: Administrator defaults saved
          content:
            application/json:
              schema:
                type: object
                required: [defaults]
                properties:
                  defaults:
                    $ref: "#/components/schemas/StudioAutomation"
  /creative-studio/clients/{clientId}/config:
    parameters:
      - $ref: "#/components/parameters/StudioClientId"
    put:
      operationId: putCreativeStudioConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioConfig"
      responses:
        "200":
          description: Scoped configuration saved
          content:
            application/json:
              schema:
                type: object
                required: [config]
                properties:
                  config:
                    $ref: "#/components/schemas/StudioConfig"
  /creative-studio/clients/{clientId}/deliverables:
    parameters:
      - $ref: "#/components/parameters/StudioClientId"
    get:
      operationId: listCreativeStudioDeliverables
      responses:
        "200":
          description: Authorized deliverables; empty collections are arrays
          content:
            application/json:
              schema:
                type: object
                required: [deliverables]
                properties:
                  deliverables:
                    type: array
                    items:
                      $ref: "#/components/schemas/StudioDeliverable"
    post:
      operationId: createCreativeStudioDeliverable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/StudioEditable"
                - type: object
                  required: [title, type, ownerId, brief]
      responses:
        "201":
          $ref: "#/components/responses/StudioItem"
  /creative-studio/clients/{clientId}/deliverables/{id}:
    parameters:
      - $ref: "#/components/parameters/StudioClientId"
      - $ref: "#/components/parameters/StudioItemId"
    get:
      operationId: getCreativeStudioDeliverable
      responses:
        "200":
          $ref: "#/components/responses/StudioItem"
    patch:
      operationId: updateCreativeStudioDeliverable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/StudioEditable"
                - type: object
                  required: [revision]
                  properties:
                    revision:
                      type: integer
                      minimum: 1
      responses:
        "200":
          $ref: "#/components/responses/StudioItem"
  /creative-studio/clients/{clientId}/deliverables/{id}/actions:
    parameters:
      - $ref: "#/components/parameters/StudioClientId"
      - $ref: "#/components/parameters/StudioItemId"
    post:
      operationId: actOnCreativeStudioDeliverable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, action]
              properties:
                revision:
                  type: integer
                action:
                  type: string
                  enum: [share, unshare, archive, restore, duplicate, request_approval, decide, schedule, unschedule, remind]
                phase:
                  type: string
                  enum: [reference, final]
                approverUid:
                  type: string
                decision:
                  type: string
                  enum: [approved, changes_requested]
                feedback:
                  type: string
                link:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/StudioItem"
        "201":
          $ref: "#/components/responses/StudioItem"
  /creative-studio/clients/{clientId}/deliverables/{id}/assets:
    parameters:
      - $ref: "#/components/parameters/StudioClientId"
      - $ref: "#/components/parameters/StudioItemId"
    post:
      operationId: saveCreativeStudioAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, phase, kind, label, url]
              properties:
                revision:
                  type: integer
                assetId:
                  type: string
                phase:
                  type: string
                  enum: [reference, final]
                kind:
                  type: string
                  enum: [thumbnail, main, video, copy, file]
                label:
                  type: string
                url:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/StudioItem"
  /creative-studio/clients/{clientId}/deliverables/{id}/messages/{thread}:
    parameters:
      - $ref: "#/components/parameters/StudioClientId"
      - $ref: "#/components/parameters/StudioItemId"
      - name: thread
        in: path
        required: true
        schema:
          type: string
          enum: [client, internal]
    get:
      operationId: listCreativeStudioMessages
      responses:
        "200":
          description: Independently authorized conversation
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/StudioMessage"
    post:
      operationId: sendCreativeStudioMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotencyKey, text]
              properties:
                idempotencyKey:
                  type: string
                text:
                  type: string
                  maxLength: 5000
      responses:
        "200":
          description: Message saved or matching retry returned
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    $ref: "#/components/schemas/StudioMessage"
  /creative-studio/clients/{clientId}/deliverables/{id}/activity:
    parameters:
      - $ref: "#/components/parameters/StudioClientId"
      - $ref: "#/components/parameters/StudioItemId"
    get:
      operationId: listCreativeStudioActivity
      responses:
        "200":
          description: Staff-only append-only history
          content:
            application/json:
              schema:
                type: object
                required: [activity]
                properties:
                  activity:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /creative-studio/clients/{clientId}/deliveries:
    parameters:
      - $ref: "#/components/parameters/StudioClientId"
    get:
      operationId: listCreativeStudioDeliveries
      responses:
        "200":
          description: Scoped settings-manager delivery audit
          content:
            application/json:
              schema:
                type: object
                required: [deliveries, upcoming]
                properties:
                  deliveries:
                    type: array
                    items:
                      $ref: "#/components/schemas/StudioDelivery"
                  upcoming:
                    type: array
                    description: Read-only projections of the next authorized reminder per pending item. Empty when delivery is disabled. Never sent/opened records.
                    items:
                      allOf:
                        - $ref: "#/components/schemas/StudioDelivery"
                        - type: object
                          required: [scheduledAt]
                          properties:
                            status:
                              type: string
                              enum: [scheduled]
  /creative-studio/clients/{clientId}/preview:
    parameters:
      - $ref: "#/components/parameters/StudioClientId"
    post:
      operationId: previewCreativeStudioEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phase]
              properties:
                phase:
                  type: string
                  enum: [reference, final]
      responses:
        "200":
          description: Non-delivering email preview
          content:
            application/json:
              schema:
                type: object
                required: [subject, body, deliveryEnabled]
                properties:
                  subject:
                    type: string
                  body:
                    type: string
                  deliveryEnabled:
                    type: boolean
  /client-portal/invitations/inspect:
    post:
      operationId: inspectClientPortalInvitation
      security: []
      description: Rate-limited mailbox-token inspection. Invalid, used, revoked and expired tokens are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 43, maxLength: 43 }
      responses:
        "200":
          description: Valid pending invitation
          content:
            application/json:
              schema:
                type: object
                required: [email, requiresSignIn, expiresAt, clientNames]
                properties:
                  email: { type: string }
                  requiresSignIn: { type: boolean }
                  expiresAt: { type: number, description: Unix epoch milliseconds }
                  clientNames:
                    type: array
                    items: { type: string }
        "400": { description: Invalid or unavailable invitation }
        "429": { description: Rate limit exceeded }
  /client-portal/invitations/accept:
    post:
      operationId: acceptClientPortalInvitation
      security: []
      description: Existing identities require a revoked-token-checked Firebase Bearer session for the invited UID and email and must send token only. New precreated identities require password. Atomically consumes invitation; does not sign in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 43, maxLength: 43 }
                displayName: { type: string, minLength: 1, maxLength: 120 }
                password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      responses:
        "200":
          description: Invitation accepted; sign in normally afterward
          content:
            application/json:
              schema:
                type: object
                required: [accepted, email]
                properties:
                  accepted: { type: boolean, enum: [true] }
                  email: { type: string }
        "400": { description: "Invalid, expired, revoked, used invitation or invalid input" }
        "401": { description: Existing account sign-in required }
        "403": { description: Wrong account or unavailable identity }
        "429": { description: Rate limit exceeded }
  /client-portal/me:
    get:
      operationId: getClientPortalMe
      responses:
        "200":
          description: Assigned clients only
          content:
            application/json:
              schema:
                type: object
                required: [clients]
                properties:
                  clients:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortalClient"
  /client-portal/clients/{clientId}/tasks:
    parameters:
      - name: clientId
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
    get:
      operationId: listClientPortalTasks
      responses:
        "200":
          description: Safe shared task projection
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortalTask"
    post:
      operationId: createClientPortalTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalTaskInput"
      responses:
        "201":
          description: Created ordinary task
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task:
                    $ref: "#/components/schemas/PortalTask"
  /client-portal/clients/{clientId}/tasks/{taskId}:
    parameters:
      - name: clientId
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
      - name: taskId
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
    patch:
      operationId: updateClientPortalTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [Pending, In Progress, Completed] }
      responses:
        "200":
          description: Updated safe task projection; stored statuses are Pending, WIP and Done respectively
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task:
                    $ref: "#/components/schemas/PortalTask"
        "400": { description: Invalid task key or unsupported status or extra fields }
        "401": { description: Sign-in required }
        "403": { description: Verified active assigned client access required }
        "404": { description: Shared ordinary task not found }
        "409": { description: Internal timer or quality review prevents client status changes }
  /client-portal/clients/{clientId}/tasks/{taskId}/collaboration:
    parameters:
      - $ref: "#/components/parameters/StudioClientId"
      - $ref: "#/components/parameters/CollaborationTaskId"
    get:
      operationId: getClientTaskCollaboration
      description: Shared ordinary tasks only; verified assigned clients or active authorized project staff. No internal task messages, steps or links.
      responses:
        "200":
          description: At most 200 entries and 100 subtasks, oldest first; server-only actor identifiers omitted
          content:
            application/json:
              schema:
                type: object
                required: [entries, subtasks]
                properties:
                  entries:
                    type: array
                    maxItems: 200
                    items: { $ref: "#/components/schemas/ClientTaskCollaborationEntry" }
                  subtasks:
                    type: array
                    maxItems: 100
                    items: { $ref: "#/components/schemas/ClientTaskCollaborationSubtask" }
        "400": { description: Invalid key }
        "401": { description: Session missing or revoked }
        "403": { description: Verified active client membership or staff project permission required }
        "404": { description: Shared ordinary task unavailable }
  /client-portal/clients/{clientId}/tasks/{taskId}/collaboration/entries:
    parameters:
      - $ref: "#/components/parameters/StudioClientId"
      - $ref: "#/components/parameters/CollaborationTaskId"
    post:
      operationId: createClientTaskCollaborationEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientTaskCollaborationEntryInput" }
      responses:
        "201":
          description: Created entry or original entry for an identical actor-scoped UUID retry
          content:
            application/json:
              schema:
                type: object
                required: [entry]
                properties:
                  entry: { $ref: "#/components/schemas/ClientTaskCollaborationEntry" }
        "400": { description: "Invalid or extra fields; links require HTTP(S) URLs without credentials, messages and notes require nonblank text and no URL" }
        "401": { description: Session missing or revoked }
        "403": { description: Verified active client membership or staff project permission required }
        "404": { description: Shared ordinary task unavailable }
        "409": { description: Request UUID reused for changed content or task entry limit reached }
        "429": { description: Actor write limit of 60 changes per minute reached }
  /client-portal/clients/{clientId}/tasks/{taskId}/collaboration/subtasks:
    parameters:
      - $ref: "#/components/parameters/StudioClientId"
      - $ref: "#/components/parameters/CollaborationTaskId"
    post:
      operationId: createClientTaskCollaborationSubtask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientTaskCollaborationSubtaskInput" }
      responses:
        "201":
          description: Created shared subtask, or original subtask for identical actor-scoped UUID retry
          content:
            application/json:
              schema:
                type: object
                required: [subtask]
                properties:
                  subtask: { $ref: "#/components/schemas/ClientTaskCollaborationSubtask" }
        "400": { description: Invalid or extra fields or blank title }
        "401": { description: Session missing or revoked }
        "403": { description: Verified active client membership or staff project permission required }
        "404": { description: Shared ordinary task unavailable }
        "409": { description: Request UUID reused for changed content or task subtask limit reached }
        "429": { description: Actor write limit of 60 changes per minute reached }
  /client-portal/clients/{clientId}/tasks/{taskId}/collaboration/subtasks/{subtaskId}:
    parameters:
      - $ref: "#/components/parameters/StudioClientId"
      - $ref: "#/components/parameters/CollaborationTaskId"
      - name: subtaskId
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    patch:
      operationId: updateClientTaskCollaborationSubtask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientTaskCollaborationSubtaskUpdate" }
      responses:
        "200":
          description: Updated shared subtask; all other fields preserved
          content:
            application/json:
              schema:
                type: object
                required: [subtask]
                properties:
                  subtask: { $ref: "#/components/schemas/ClientTaskCollaborationSubtask" }
        "400": { description: Invalid or extra fields }
        "401": { description: Session missing or revoked }
        "403": { description: Verified active client membership or staff project permission required }
        "404": { description: Shared task or subtask unavailable }
        "429": { description: Actor write limit of 60 changes per minute reached }
  /client-portal/admin/users:
    get:
      operationId: listClientPortalUsers
      responses:
        "200":
          description: External memberships
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortalUser"
    post:
      operationId: inviteClientPortalUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalInvitationInput"
      responses:
        "201":
          description: Membership saved and invitation delivery reported
          content:
            application/json:
              schema:
                type: object
                required: [user, invitationSent]
                properties:
                  user:
                    $ref: "#/components/schemas/PortalUser"
                  invitationSent: { type: boolean }
  /client-portal/admin/users/{uid}:
    parameters:
      - name: uid
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    delete:
      operationId: deleteClientPortalUser
      description: Administrator-only permanent deletion of a client login, membership and invitation lookups. Preserves client companies, tasks, assets and history. Failed deletion leaves access blocked for retry.
      responses:
        "200":
          description: Client login and access permanently deleted (also returned for an already deleted account).
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean, enum: [true] }
        "400":
          description: Invalid UID.
        "401":
          description: Authentication required.
        "403":
          description: Administrator required or protected staff identity.
        "404":
          description: Existing identity is not a managed client account.
        "409":
          description: Membership changed; retry deletion.
        "503":
          description: Identity verification, Auth deletion or cleanup failed; retry deletion.
    patch:
      operationId: updateClientPortalUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalMembershipInput"
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/PortalUser"
  /client-portal/admin/users/{uid}/invite:
    parameters:
      - name: uid
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
    post:
      operationId: resendClientPortalInvitation
      responses:
        "200":
          description: Invitation delivered
          content:
            application/json:
              schema:
                type: object
                required: [invitationSent]
                properties:
                  invitationSent: { type: boolean }
  /client-portal/admin/users/{uid}/invite/revoke:
    parameters:
      - name: uid
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
    post:
      operationId: revokeClientPortalInvitation
      description: Invalidates only a pending invitation, not accepted membership access.
      responses:
        "200":
          description: Pending invitation revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: boolean, enum: [true] }
        "409": { description: No pending invitation }
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    CollaborationTaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    StudioClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,128}$"
    StudioItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,128}$"
  responses:
    StudioItem:
      description: Current authorized deliverable; stale mutation revisions return 409
      content:
        application/json:
          schema:
            type: object
            required: [deliverable]
            properties:
              emailError:
                type: string
              deliverable:
                $ref: "#/components/schemas/StudioDeliverable"
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    ClientTaskCollaborationEntry:
      type: object
      required: [id, type, text, url, authorName, createdAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [message, note, link] }
        text: { type: string }
        url: { type: string, nullable: true }
        authorName: { type: string }
        createdAt: { type: number, description: Server Unix epoch milliseconds }
    ClientTaskCollaborationSubtask:
      type: object
      required: [id, title, completed, authorName, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        completed: { type: boolean }
        authorName: { type: string }
        createdAt: { type: number, description: Server Unix epoch milliseconds }
    ClientTaskCollaborationEntryInput:
      type: object
      additionalProperties: false
      required: [type, text, requestId]
      properties:
        type: { type: string, enum: [message, note, link] }
        text: { type: string, maxLength: 4000 }
        url: { type: string, maxLength: 2048, description: Required only for links; HTTP(S) only, no credentials }
        requestId: { type: string, pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$" }
    ClientTaskCollaborationSubtaskInput:
      type: object
      additionalProperties: false
      required: [title, requestId]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        requestId: { type: string, pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$" }
    ClientTaskCollaborationSubtaskUpdate:
      type: object
      additionalProperties: false
      required: [completed]
      properties:
        completed: { type: boolean }
    StudioAutomation:
      type: object
      additionalProperties: false
      required: [enabled, sendTime, timezone, cadenceDays]
      properties:
        enabled:
          type: boolean
        sendTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        timezone:
          type: string
        cadenceDays:
          type: integer
          minimum: 1
          maximum: 30
        reference:
          $ref: "#/components/schemas/StudioPhaseAutomation"
        final:
          $ref: "#/components/schemas/StudioPhaseAutomation"
    StudioPhaseAutomation:
      type: object
      additionalProperties: false
      required: [enabled, escalationDays, subject, body]
      description: Optional phase override; defaults enabled, reference escalation 5 days, final 2 days. Uses inherited sendTime/timezone/cadenceDays. Plain-text templates accept only {{client}}, {{post}}, {{date}}, {{type}}, {{deadline}}.
      properties:
        enabled:
          type: boolean
          default: true
        escalationDays:
          type: integer
          minimum: 0
          maximum: 365
        subject:
          type: string
          minLength: 1
          maxLength: 240
          description: Single-line subject.
        body:
          type: string
          minLength: 1
          maxLength: 10000
    StudioDelivery:
      type: object
      additionalProperties: true
      required: [id, itemId, clientId, itemTitle, approvalPhase, recipientName, status]
      properties:
        id:
          type: string
        itemId:
          type: string
        clientId:
          type: string
        itemTitle:
          type: [string, "null"]
        approvalPhase:
          type: [string, "null"]
          enum: [reference, final, null]
        recipientUid:
          type: string
        recipientName:
          type: [string, "null"]
        revision:
          type: integer
        kind:
          type: string
          enum: [request, reminder, decision, escalation]
        status:
          type: string
          description: Stored transport state or scheduled projection; no fabricated opened/read state.
        createdAt:
          type: number
          description: Unix milliseconds; actual delivery rows only.
        sentAt:
          type: number
          description: Unix milliseconds; confirmed sends only.
        scheduledAt:
          type: number
          description: Unix milliseconds; upcoming projections only.
    StudioConfig:
      type: object
      required: [enabled, ownerIds, editorIds, timezone, automation]
      properties:
        enabled:
          type: boolean
        ownerIds:
          type: array
          items:
            type: string
        editorIds:
          type: array
          items:
            type: string
        timezone:
          type: string
        automation:
          $ref: "#/components/schemas/StudioAutomation"
        updatedAt:
          type: number
          readOnly: true
        updatedBy:
          type: string
          readOnly: true
    StudioBootstrap:
      type: object
      required: [clients, configs, capabilities, owners, approvers]
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/PortalClient"
        configs:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
        capabilities:
          type: object
          required: [isClient, canManageSettings, canManageDefaults, canEdit, manageableClientIds, editableClientIds]
          properties:
            isClient:
              type: boolean
            canManageSettings:
              type: boolean
            canManageDefaults:
              type: boolean
            canEdit:
              type: boolean
            manageableClientIds:
              type: array
              items:
                type: string
            editableClientIds:
              type: array
              items:
                type: string
        owners:
          type: array
          items:
            type: object
            required: [id, name, clientIds]
            properties:
              id:
                type: string
              name:
                type: string
              clientIds:
                type: array
                items:
                  type: string
        staffCandidates:
          type: array
          items:
            type: object
            required: [id, name, clientIds]
            properties:
              id:
                type: string
              name:
                type: string
              clientIds:
                type: array
                items:
                  type: string
        approvers:
          type: array
          items:
            type: object
            required: [uid, name, clientIds]
            properties:
              uid:
                type: string
              name:
                type: string
              clientIds:
                type: array
                items:
                  type: string
        defaults:
          anyOf:
            - $ref: "#/components/schemas/StudioAutomation"
            - type: "null"
    StudioEditable:
      type: object
      properties:
        title:
          type: string
          maxLength: 240
        type:
          type: string
          enum: [Post, Reel, Story]
        ownerId:
          type: string
        brief:
          type: string
          maxLength: 10000
        caption:
          type: string
          maxLength: 10000
        platforms:
          type: array
          items:
            type: string
            enum: [Instagram, Facebook, LinkedIn, YouTube Shorts]
        productionDueDate:
          type: [string, "null"]
        plannedAt:
          type: [string, "null"]
        timezone:
          type: string
    StudioAsset:
      type: object
      required: [id, phase, kind, label, url, revision]
      properties:
        id:
          type: string
        phase:
          type: string
          enum: [reference, final]
        kind:
          type: string
          enum: [thumbnail, main, video, copy, file]
        label:
          type: string
        url:
          type: string
        revision:
          type: integer
        updatedAt:
          type: number
        updatedBy:
          type: string
        history:
          type: array
          items:
            type: object
            additionalProperties: true
    StudioDeliverable:
      allOf:
        - $ref: "#/components/schemas/StudioEditable"
        - type: object
          required: [id, clientId, revision, stage, shared, archived, scheduled, assets, approvals, createdAt, updatedAt]
          properties:
            id:
              type: string
            clientId:
              type: string
            revision:
              type: integer
            stage:
              type: string
              enum: [internal_draft, awaiting_reference, reference_changes, in_production, awaiting_final, final_changes, final_approved]
            shared:
              type: boolean
            archived:
              type: boolean
            scheduled:
              type: [object, "null"]
              properties:
                at:
                  type: number
                actor:
                  type: string
                link:
                  type: [string, "null"]
            assets:
              type: array
              items:
                $ref: "#/components/schemas/StudioAsset"
            approvals:
              type: object
              additionalProperties:
                type: object
                additionalProperties: true
            createdAt:
              type: number
            updatedAt:
              type: number
    StudioMessage:
      type: object
      required: [id, text, author, authorUid, at]
      properties:
        id:
          type: string
        text:
          type: string
        author:
          type: string
        authorUid:
          type: string
        at:
          type: number
    PortalTaskInput:
      type: object
      additionalProperties: false
      required: [title, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        category: { type: string, maxLength: 100 }
        dueDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        reminderDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        reminderTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        reminderTimezone: { type: string, minLength: 1, maxLength: 100 }
        subtasks:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 300 }
        links:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [text, url]
            properties:
              text: { type: string, minLength: 1, maxLength: 4000 }
              url: { type: string, minLength: 1, maxLength: 2000 }
    PortalInvitationInput:
      type: object
      additionalProperties: false
      required: [email, clientIds]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        clientIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
    PortalMembershipInput:
      type: object
      additionalProperties: false
      required: [clientIds, disabled]
      properties:
        clientIds:
          type: array
          maxItems: 100
          items: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
        disabled: { type: boolean }
    PortalClient:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    PortalTask:
      type: object
      required: [id, title, description, category, status, dueDate, statusEditable, statusEditReason]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        status: { type: string }
        statusEditable: { type: boolean }
        statusEditReason: { type: string, description: Safe explanation when statusEditable is false; empty otherwise }
        dueDate: { type: string }
        reminderDate: { type: string }
        reminderTime: { type: string }
        reminderTimezone: { type: string }
    PortalUser:
      type: object
      required: [uid, email, disabled, clientIds]
      properties:
        uid: { type: string }
        email: { type: string }
        disabled: { type: boolean }
        invitationStatus: { type: string, enum: [pending, expired, revoked, accepted] }
        invitationExpiresAt: { type: number, description: Unix epoch milliseconds; absent for legacy memberships }
        clientIds:
          type: array
          items: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

