openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - FirebaseBearer: []
tags:
  - name: health
    description: Health operations
paths:
  /client-portal/me:
    get:
      operationId: getClientPortalMe
      responses:
        "200":
          description: Assigned clients only
          content:
            application/json:
              schema:
                type: object
                required: [clients]
                properties:
                  clients:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortalClient"
  /client-portal/clients/{clientId}/tasks:
    parameters:
      - name: clientId
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
    get:
      operationId: listClientPortalTasks
      responses:
        "200":
          description: Safe shared task projection
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortalTask"
    post:
      operationId: createClientPortalTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalTaskInput"
      responses:
        "201":
          description: Created ordinary task
          content:
            application/json:
              schema:
                type: object
                required: [task]
                properties:
                  task:
                    $ref: "#/components/schemas/PortalTask"
  /client-portal/admin/users:
    get:
      operationId: listClientPortalUsers
      responses:
        "200":
          description: External memberships
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortalUser"
    post:
      operationId: inviteClientPortalUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalInvitationInput"
      responses:
        "201":
          description: Membership saved and invitation delivery reported
          content:
            application/json:
              schema:
                type: object
                required: [user, invitationSent]
                properties:
                  user:
                    $ref: "#/components/schemas/PortalUser"
                  invitationSent: { type: boolean }
  /client-portal/admin/users/{uid}:
    parameters:
      - name: uid
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
    patch:
      operationId: updateClientPortalUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalMembershipInput"
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/PortalUser"
  /client-portal/admin/users/{uid}/invite:
    parameters:
      - name: uid
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
    post:
      operationId: resendClientPortalInvitation
      responses:
        "200":
          description: Invitation delivered
          content:
            application/json:
              schema:
                type: object
                required: [invitationSent]
                properties:
                  invitationSent: { type: boolean }
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    PortalTaskInput:
      type: object
      additionalProperties: false
      required: [title, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        dueDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
    PortalInvitationInput:
      type: object
      additionalProperties: false
      required: [email, clientIds]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        clientIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
    PortalMembershipInput:
      type: object
      additionalProperties: false
      required: [clientIds, disabled]
      properties:
        clientIds:
          type: array
          maxItems: 100
          items: { type: string, pattern: "^[A-Za-z0-9_-]+$" }
        disabled: { type: boolean }
    PortalClient:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    PortalTask:
      type: object
      required: [id, title, description, status, dueDate]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string }
        dueDate: { type: string }
    PortalUser:
      type: object
      required: [uid, email, disabled, clientIds]
      properties:
        uid: { type: string }
        email: { type: string }
        disabled: { type: boolean }
        clientIds:
          type: array
          items: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

