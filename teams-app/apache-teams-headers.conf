# ---------------------------------------------------------------------------
# Apache VirtualHost snippet — Teams iframe framing headers
# ---------------------------------------------------------------------------
#
# Problem
# -------
# Apache ships with (or globally enables) `Header always set X-Frame-Options
# SAMEORIGIN`.  Microsoft Teams embeds tab apps inside an iframe, so this
# header causes a blank screen in the Teams desktop / web client.
#
# Solution
# --------
# Add the two directives below to the <VirtualHost> block for
# project.ethinos.com.  They:
#   1. Strip X-Frame-Options from every response.
#   2. Replace it with a Content-Security-Policy that only allows framing
#      by Teams / Skype origins (tighter than removing the header entirely).
#
# NOTE: mod_headers must be enabled.
#   sudo a2enmod headers
#   sudo systemctl reload apache2
#
# Apply steps
# -----------
# 1. Open the VirtualHost config (usually one of):
#      /etc/apache2/sites-available/project.ethinos.com.conf
#      /etc/apache2/sites-available/000-default.conf
# 2. Inside the <VirtualHost *:443> block, add the directives below.
# 3. Run:  sudo apache2ctl configtest  (should print "Syntax OK")
# 4. Run:  sudo systemctl reload apache2
# 5. Verify with the smoke-test script:
#      bash scripts/check-teams-headers.sh https://project.ethinos.com
#
# Example VirtualHost (minimal)
# ------------------------------
# <VirtualHost *:443>
#     ServerName project.ethinos.com
#     DocumentRoot /var/www/html/pmt-app
#
#     # --- Teams iframe fix (paste the block below) ---
#     <IfModule mod_headers.c>
#         Header always unset X-Frame-Options
#         Header always set Content-Security-Policy \
#             "frame-ancestors 'self' https://teams.microsoft.com https://*.teams.microsoft.com https://*.skype.com"
#     </IfModule>
#     # --- end Teams iframe fix ---
#
#     # ... rest of your VirtualHost config ...
# </VirtualHost>
# ---------------------------------------------------------------------------

<IfModule mod_headers.c>
    Header always unset X-Frame-Options
    Header always set Content-Security-Policy "frame-ancestors 'self' https://teams.microsoft.com https://*.teams.microsoft.com https://*.skype.com"
</IfModule>
